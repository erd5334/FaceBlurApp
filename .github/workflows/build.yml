name: Build and Release v1.2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: FaceBlur_Windows.exe
          - os: macos-latest
            artifact_name: FaceBlur_macOS
          - os: ubuntu-latest
            artifact_name: FaceBlur_Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Build Tools (Linux Only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libtk-img

      - name: Build with PyInstaller
        shell: bash
        run: |
          # İşletim sistemine göre veri ayırıcıyı belirle (; windows, : unix)
          SEP=":"
          if [ "${{ runner.os }}" == "Windows" ]; then SEP=";"; fi
          
          pyinstaller --noconsole --onefile --name "YuzBulaniklastirma" \
          --add-data "blaze_face_short_range.tflite${SEP}." \
          --add-data "haarcascade_frontalface_default.xml${SEP}." \
          --add-data "app_icon.ico${SEP}." \
          --collect-all customtkinter \
          --collect-all tkinterdnd2 \
          --collect-all mediapipe \
          --hidden-import "PIL._tkinter_finder" \
          --icon "app_icon.ico" \
          main.py

      - name: Rename Artifact (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          mv dist/YuzBulaniklastirma dist/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.exe
            dist/FaceBlur_macOS
            dist/FaceBlur_Linux

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            dist/FaceBlur_macOS
            dist/FaceBlur_Linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
